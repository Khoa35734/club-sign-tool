[package]
name = "club-sign-tool"
version = "0.1.0"
description = "Club Sign Tool — Local/Offline Desktop Utility"
authors = ["Club Sign Tool Contributors"]
edition = "2021"

[lib]
name = "club_sign_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
